name: CI

on:
  push:
    branches: [ main, 'release-*' ]
  pull_request:
    branches: [ main, 'release-*' ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # knope, which raises the version from the changesets (knope.toml).
  KNOPE_VERSION: "0.23.2"

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    # GitHub's macOS arm64 runners are often short: a job waiting for one
    # is cancelled after a while and must not block a merge. Linux and
    # Windows still do; macOS reports, and is not a required check.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 30 || 60 }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy all-features
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-targets --all-features -- -D warnings

      - name: Test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all-features

      - name: Cargo Doc
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions-rs/cargo@v1
        with:
          command: doc
          args: --lib --no-deps --all-features

  # The demo (demo/) builds for the browser, as the Pages workflow
  # (pages.yml) builds it on main; nothing is deployed here.
  web-demo:
    name: Web demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2

      # The CLI must have the version of the `wasm-bindgen` crate, which demo/Cargo.toml pins.
      - name: wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' demo/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Clippy
        run: cargo clippy -p egui_stack_demo --target wasm32-unknown-unknown -- -D warnings

      - name: Build
        run: sh demo/build-web.sh

  # The crate against its latest release on crates.io, with the version
  # the pending changesets lead to: a break passes when its changeset says
  # major (a new minor before 1.0), fails otherwise (RELEASING.md).
  semver:
    name: Semver checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: ${{ env.KNOPE_VERSION }}

      # Raises the version in this checkout only; nothing is committed.
      - name: The version the pending changesets lead to
        run: |
          knope pending-versions
          git status --short

      - run: cargo semver-checks check-release

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: RustFmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Miri
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: miri

      # Separate miri setup from run so that 'Miri Test'
      # logs are clean.
      - name: Setup Miri
        uses: actions-rs/cargo@v1
        with:
          command: miri
          args: setup

      - name: Miri Test
        uses: actions-rs/cargo@v1
        with:
          command: miri
          args: test --all-features
