name: Changesets

# Apart from CI so that labelling a pull request `internal` runs this
# check again, and only this one (RELEASING.md).
on:
  pull_request:
    branches: [ main, next, 'release-*' ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

env:
  # knope, which raises the version from the changesets (knope.toml).
  KNOPE_VERSION: "0.23.2"

jobs:
  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the changesets
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          INTERNAL: ${{ contains(github.event.pull_request.labels.*.name, 'internal') }}
        run: |
          if [ "$INTERNAL" = true ]; then
            sh scripts/changeset-check.sh "$BASE" --internal
          else
            sh scripts/changeset-check.sh "$BASE"
          fi

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: ${{ env.KNOPE_VERSION }}

      - name: What a release would do
        run: knope release --dry-run
