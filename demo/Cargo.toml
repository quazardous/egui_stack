[package]
name = "egui_stack_demo"
description = "The egui_stack demo, native and in the browser"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
egui = { version = "0.37", default-features = false }
egui_stack = { path = "..", features = ["serde"] }
eframe = { version = "0.37", default-features = false, features = [
    "default",
    "default_fonts",
    "glow",
] }
serde_json = "1"

# The GIF recorder's (tests/record_gif.rs), behind the `record` feature so
# wgpu is not built with every test run (#178): enabled, Cargo would unify
# `egui_kittest/wgpu` into the library's tests too in a workspace build.
egui_kittest = { version = "0.37", features = ["wgpu"], optional = true }
gif = { version = "0.14", optional = true }
image = { version = "0.25", default-features = false, optional = true }

[features]
record = ["dep:egui_kittest", "dep:gif", "dep:image"]

# The web runner. `wasm-bindgen` is pinned: the `wasm-bindgen` CLI that
# processes the build must have the same version (see README.md here).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
egui_kittest = "0.37"

[[test]]
name = "record_gif"
required-features = ["record"]
