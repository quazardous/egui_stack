[package]
name = "egui_stack"
description = "Docking system for egui, continuing egui_dock"
authors = ["lain-dono", "Adam Gąsior (Adanos020)", "egui_stack contributors"]
version = "0.24.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
readme = "README.md"
repository = "https://github.com/quazardous/egui_stack"
categories = ["gui", "game-development"]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE", "NOTICE"]
keywords = ["egui", "gui", "dock", "panels", "layout"]

[features]
default = []

# Enable serialization of `Tree`.
serde = ["dep:serde", "egui/serde"]

[dependencies]
egui = { version = "0.37", default-features = false }
serde = { version = "1", optional = true, features = ["derive"] }

duplicate = "2.0"
paste = "1.0"
thiserror = "2.0.18"

[dev-dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default",
    "default_fonts",
    "glow",
] }
egui_kittest = "0.37"
serde_json = { version = "1" }

[[example]]
name = "save_load_dock_state"
required-features = ["serde"]
