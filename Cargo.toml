[package]
name = "egui_stack"
description = "Docking system for egui, continuing egui_dock"
authors = ["lain-dono", "Adam Gąsior (Adanos020)", "egui_stack contributors"]
version = "0.29.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
readme = "README.md"
repository = "https://github.com/quazardous/egui_stack"
categories = ["gui", "game-development"]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE", "NOTICE"]
keywords = ["egui", "gui", "dock", "panels", "layout"]

# The demo (`demo/`) is a separate crate, so its dependencies, the web ones
# included, are not the library's.
[workspace]
members = ["demo"]

[features]
default = []

# Enable serialization of `Tree`.
serde = ["dep:serde", "egui/serde"]

# Declare egui_stack's points (`stack.*`) on an application's bus
# (bus-contract): the drop veto, the close policy and the layout and
# window events. See `DockSpace::with_bus`.
bus = ["dep:bus-contract"]

[dependencies]
egui = { version = "0.37", default-features = false }
serde = { version = "1", optional = true, features = ["derive"] }
bus-contract = { version = "0.3.2", optional = true }

duplicate = "2.0"
paste = "1.0"
thiserror = "2.0.18"

[dev-dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default",
    "default_fonts",
    "glow",
] }
egui_kittest = "0.37"
serde_json = { version = "1" }

[[example]]
name = "save_load_dock_state"
required-features = ["serde"]
